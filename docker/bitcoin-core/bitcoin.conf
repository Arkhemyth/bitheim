# Bitheim Bitcoin Core Regtest Configuration
# Pure regtest mode for local development and integration tests
regtest=1
server=1
listen=1
fallbackfee=0.0001
datadir=/data/bitcoin

# Cookie authentication with dedicated group-readable permissions (0640)
# Group 10000 (bitheim-rpc) can read the cookie file; others have no access
rpccookiefile=/data/rpc/.cookie
rpccookieperms=group

# Bind to container internal interface; rpcallowip is set dynamically from validated Compose subnet
rpcbind=0.0.0.0

# Transaction and mempool settings
txindex=1
mempoolreplacement=fee,optin
