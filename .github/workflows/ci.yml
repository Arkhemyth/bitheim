name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: "0.11.31"

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Check code formatting (Ruff)
        run: uv run ruff format --check .

      - name: Lint codebase (Ruff)
        run: uv run ruff check .

      - name: Static type check (MyPy)
        run: uv run mypy src

      - name: Run automated test suite (Pytest)
        run: uv run pytest

  container:
    name: Container Image & Multi-Arch Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build native container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bitheim:ci
          cache-from: type=gha,scope=native
          cache-to: type=gha,mode=max,scope=native

      - name: Smoke test CLI help flag
        run: docker run --rm bitheim:ci --help

      - name: Smoke test CLI version flag
        run: docker run --rm bitheim:ci --version

      - name: Smoke test CLI doctor diagnostics
        run: docker run --rm bitheim:ci doctor

      - name: Verify non-root execution user
        run: |
          UID_OUTPUT=$(docker run --rm --entrypoint id bitheim:ci -u)
          echo "Container runtime UID: ${UID_OUTPUT}"
          test "${UID_OUTPUT}" = "10001"

      - name: Verify immutable application environment
        run: |
          if docker run --rm --entrypoint touch bitheim:ci /opt/bitheim/.venv/test_immutable 2>/dev/null; then
            echo "Security violation: /opt/bitheim/.venv was writable by runtime user"
            exit 1
          fi

      - name: Verify writable data directory
        run: docker run --rm --entrypoint touch bitheim:ci /data/test_ephemeral

      - name: Validate multi-platform build (linux/amd64, linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch
